name: ${SERVICE_NAME}-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-auth-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-auth-db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-auth-service}
      SERVICE_ENV: ${SERVICE_ENV:-local}
      SERVICE_PORT: ${SERVICE_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-auth-db}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/etc/sleipnir/jwt_private.pem}
      JWT_ISSUER: ${JWT_ISSUER:-sleipnir-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-trading-backend,keys-service}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
    volumes:
      # Mount the RSA keypair generated via `go run ./cmd/genkey -out ./secrets`.
      # The private key must never be baked into the image.
      - ./secrets:/etc/sleipnir:ro
    ports:
      - "8085:${SERVICE_PORT:-8080}"

volumes:
  postgres_data:
